<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>009 Couture — Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --panel:#0e0e10; --line:#333; --muted:#7a7a7a; --fg:#f2f2f3; --yellow:#ebcc00; --danger:#e2564d; --mono:"Courier New",Courier,monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--mono); font-size:14px; }
  button, input, select, textarea { font-family:var(--mono); }
  button { cursor:pointer; }
  .hidden { display:none !important; }
  .yellow { color:var(--yellow); }
  /* login */
  .login { min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .login form { background:var(--panel); border:1px solid var(--line); padding:34px; width:340px; }
  .login .logo { height:26px; margin-bottom:22px; }
  .login h1 { margin:0 0 4px; font-size:15px; letter-spacing:.12em; text-transform:uppercase; }
  .login p { margin:0 0 20px; color:var(--muted); font-size:12px; letter-spacing:.04em; }
  input, select, textarea { width:100%; background:#000; border:1px solid var(--line); color:var(--fg); padding:10px 12px; margin-top:6px; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:#fff; }
  textarea { min-height:84px; resize:vertical; }
  label { display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:14px; }
  .btn { background:#fff; color:#000; border:0; padding:11px 18px; letter-spacing:.06em; text-transform:uppercase; font-size:12px; transition:background .16s; }
  .btn:hover:not(:disabled) { background:var(--yellow); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn--ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  .btn--ghost:hover { background:transparent; border-color:#fff; }
  .btn--danger { background:transparent; color:var(--danger); border:1px solid #4a2b2b; }
  .btn--sm { padding:6px 12px; font-size:11px; }
  .err { color:var(--danger); font-size:12px; margin-top:12px; min-height:15px; }
  /* header */
  header.bar { display:flex; align-items:center; gap:22px; height:60px; padding:0 24px; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; background:#000; }
  header.bar .logo { height:22px; }
  .tabs { display:flex; gap:4px; }
  .tabs button { background:transparent; border:0; color:var(--muted); padding:9px 14px; text-transform:uppercase; letter-spacing:.06em; font-size:12px; }
  .tabs button.active { color:#000; background:var(--yellow); }
  .bar .spacer { flex:1; }
  /* studio canvas — a scaled mirror of the site */
  .canvas { max-width:1120px; margin:0 auto; padding:26px 24px 90px; }
  .canvas-note { color:var(--muted); font-size:12px; letter-spacing:.04em; margin:0 0 16px; }
  .sec-title { font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:30px 0 12px; display:flex; align-items:center; gap:12px; }
  .sec-title .spacer { flex:1; }
  /* hero preview */
  .hero-mini { position:relative; height:280px; border:1px solid var(--line); background-size:cover; background-position:center 32%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:34px; overflow:hidden; }
  .hero-mini::after { content:""; position:absolute; inset:0; background:linear-gradient(to bottom,transparent 45%,rgba(0,0,0,.85)); }
  .hero-mini .lock { position:relative; z-index:1; text-align:center; }
  .hero-mini .lock .cou { font-size:12px; letter-spacing:.22em; }
  .hero-mini .lock .banda { font-family:"UnifrakturCook",serif; font-size:46px; line-height:.9; margin:2px 0; }
  .hero-mini .lock .drop { font-size:10px; letter-spacing:.18em; color:var(--yellow); }
  .hero-edit { position:absolute; z-index:2; top:12px; right:12px; }
  /* product grid — mirrors the site catalog grid */
  .grid { display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--line); border-left:1px solid var(--line); }
  @media (max-width:800px){ .grid { grid-template-columns:repeat(2,1fr); } }
  .cell { position:relative; background:#0a0a0b; aspect-ratio:3/4.4; display:flex; flex-direction:column; cursor:pointer; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
  .cell.dragging { opacity:.35; }
  .cell.over { outline:2px solid var(--yellow); outline-offset:-2px; z-index:1; }
  .cell .ph { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .cell .ph img { width:78%; height:78%; object-fit:contain; }
  .cell .cap { padding:8px 10px 12px; border-top:1px solid #1c1c1e; }
  .cell .cap b { display:block; font-size:11px; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cell .cap span { color:var(--muted); font-size:11px; }
  .cell .badge { position:absolute; top:8px; left:8px; font-size:9px; letter-spacing:.06em; padding:2px 7px; border:1px solid var(--line); color:var(--muted); background:rgba(0,0,0,.6); text-transform:uppercase; }
  .cell .badge.on { color:var(--yellow); border-color:#4a4426; }
  .cell .hoverbar { position:absolute; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s; }
  .cell:hover .hoverbar { opacity:1; }
  .cell .hoverbar span { background:var(--yellow); color:#000; padding:7px 14px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
  .cell.add { align-items:center; justify-content:center; color:var(--muted); border:1px dashed #444; background:#050506; }
  .cell.add:hover { color:var(--yellow); border-color:var(--yellow); }
  .cell.add .plus { font-size:34px; line-height:1; }
  .cell.add div:last-child { font-size:11px; letter-spacing:.06em; text-transform:uppercase; margin-top:6px; }
  /* home section zones: sec1 (top of home) / sec2 (bottom of home) / catalog-only */
  .grid .zone { grid-column:1/-1; background:#050506; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:11px 15px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .grid .zone b { color:var(--yellow); font-size:11px; text-transform:uppercase; letter-spacing:.1em; }
  .grid .zone span { color:var(--muted); font-size:11px; letter-spacing:.02em; }
  .grid .zone.cat b { color:var(--muted); }
  /* collections + catalog bar */
  .coll-grid { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); }
  @media (max-width:800px){ .coll-grid { grid-template-columns:1fr; } }
  .coll-cell { position:relative; height:230px; background-size:cover; background-position:center; display:flex; align-items:flex-end; padding:20px; }
  .coll-cell::after { content:""; position:absolute; inset:0; background:linear-gradient(to top,rgba(0,0,0,.65),transparent 60%); }
  .coll-cell .coll-label { position:relative; z-index:1; }
  .coll-cell .coll-label span { display:block; font-size:11px; color:#cfcfcf; text-transform:uppercase; letter-spacing:.08em; }
  .coll-cell .coll-label b { font-size:16px; }
  .coll-edit { position:absolute; z-index:2; top:12px; right:12px; }
  .cat-bar { display:flex; gap:24px; padding:14px 2px; border-bottom:1px solid var(--line); margin-bottom:1px; flex-wrap:wrap; }
  .cat-bar span { color:var(--muted); text-transform:uppercase; font-size:12px; letter-spacing:.04em; }
  .cat-bar span { cursor:pointer; }
  .cat-bar span:hover { color:#cfcfcf; }
  .cat-bar span.active { color:var(--yellow); }
  .cat-count { opacity:.5; font-size:10px; }
  /* orders */
  .status-bar { display:flex; gap:20px; flex-wrap:wrap; padding:12px 2px 16px; border-bottom:1px solid var(--line); margin-bottom:14px; }
  .status-bar span { cursor:pointer; color:var(--muted); text-transform:uppercase; font-size:12px; letter-spacing:.04em; }
  .status-bar span b { color:var(--fg); font-weight:400; }
  .status-bar span:hover { color:#cfcfcf; }
  .status-bar span.active, .status-bar span.active b { color:var(--yellow); }
  .ocard { border:1px solid var(--line); margin-bottom:8px; background:var(--panel); }
  .ocard-head { display:grid; grid-template-columns:190px 1fr 84px 120px 160px 18px; align-items:center; gap:14px; padding:14px 16px; cursor:pointer; }
  @media (max-width:820px){ .ocard-head { grid-template-columns:1fr auto 18px; } .oc-cust,.oc-sum,.oc-when { display:none; } }
  .oc-no { display:flex; align-items:center; gap:10px; }
  .oc-total { text-align:right; }
  .status-badge { font-size:10px; padding:2px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.04em; border:1px solid; white-space:nowrap; }
  .s-pending { color:#b0b0b0; border-color:#444; }
  .s-paid,.s-done { color:#4ccf6a; border-color:#2e5c3c; }
  .s-processing { color:var(--yellow); border-color:#4a4426; }
  .s-shipped { color:#5aa0ff; border-color:#2c4870; }
  .s-cancelled { color:var(--danger); border-color:#4a2b2b; }
  .oc-caret { text-align:center; transition:transform .2s; color:var(--muted); }
  .ocard.open .oc-caret { transform:rotate(180deg); }
  .ocard-body { display:none; grid-template-columns:1fr 1fr 170px; gap:26px; padding:2px 16px 18px; border-top:1px solid var(--line); }
  .ocard.open .ocard-body { display:grid; }
  @media (max-width:820px){ .ocard-body { grid-template-columns:1fr; gap:14px; } }
  .ocard-body h4 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:14px 0 8px; }
  .ob-item { display:flex; justify-content:space-between; padding:4px 0; font-size:13px; }
  .ob-line { font-size:13px; padding:2px 0; }
  /* modal */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex; justify-content:center; align-items:flex-start; padding:36px 16px; overflow:auto; z-index:60; }
  .modal { background:var(--panel); border:1px solid var(--line); width:600px; max-width:100%; padding:26px; }
  .modal h3 { margin:0 0 16px; font-size:14px; letter-spacing:.08em; text-transform:uppercase; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .sizes { display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .sizes label { display:inline-flex; align-items:center; gap:6px; margin:0; color:var(--fg); border:1px solid var(--line); padding:7px 11px; cursor:pointer; text-transform:none; letter-spacing:0; }
  .sizes label.on { border-color:var(--yellow); color:var(--yellow); }
  .sizes input { width:auto; margin:0; }
  .imgs { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
  .imgcell { position:relative; width:78px; height:96px; border:1px solid var(--line); overflow:hidden; cursor:grab; background:#000; }
  .imgcell.over { outline:2px solid var(--yellow); outline-offset:-2px; }
  .imgcell img { width:100%; height:100%; object-fit:contain; }
  .imgcell .del { position:absolute; top:2px; right:2px; background:rgba(0,0,0,.75); color:#fff; border:0; width:20px; height:20px; line-height:1; }
  .upl-btn { display:inline-block; margin-top:12px; border:1px dashed #444; padding:10px 16px; color:var(--muted); font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
  .modal .foot { display:flex; justify-content:space-between; margin-top:24px; }
  .row-actions { display:flex; gap:10px; }
  /* orders */
  .otable { width:100%; border-collapse:collapse; }
  .otable th,.otable td { text-align:left; padding:11px; border-bottom:1px solid var(--line); font-size:12px; vertical-align:top; }
  .otable th { color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:400; }
  .muted { color:var(--muted); }
  .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--yellow); color:#000; padding:11px 20px; letter-spacing:.04em; text-transform:uppercase; font-size:12px; z-index:200; opacity:0; transition:opacity .2s; }
  .toast.show { opacity:1; }
  /* stats */
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); }
  @media (max-width:800px){ .kpis { grid-template-columns:repeat(2,1fr); } }
  .kpi { background:var(--panel); padding:18px 16px; }
  .kpi .k-label { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .kpi .k-val { font-size:25px; margin-top:9px; letter-spacing:.01em; }
  .kpi .k-sub { font-size:11px; color:var(--muted); margin-top:8px; }
  .kpi .k-sub b { color:var(--fg); font-weight:400; }
  .chart { display:flex; align-items:flex-end; gap:3px; height:150px; border:1px solid var(--line); background:var(--panel); padding:14px 12px 0; overflow-x:auto; }
  .chart .bar { flex:1 0 6px; min-width:6px; display:flex; align-items:flex-end; background:#141410; }
  .chart .bar i { display:block; width:100%; background:var(--yellow); min-height:1px; transition:background .12s; }
  .chart .bar:hover i { background:#fff; }
  .chart-x { display:flex; justify-content:space-between; color:var(--muted); font-size:10px; margin:6px 2px 0; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  @media (max-width:800px){ .two { grid-template-columns:1fr; } }
  .bar-row { display:flex; align-items:center; gap:10px; margin:8px 0; font-size:12px; }
  .bar-row .lab { width:120px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-row .track { flex:1; height:16px; background:#1a1a1c; }
  .bar-row .track i { display:block; height:100%; background:var(--yellow); }
  .bar-row .num { width:64px; text-align:right; color:var(--muted); }
  /* stats v2: pills · period · charts · actions */
  .stats-head { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin:6px 0 20px; }
  .seg { position:relative; display:inline-flex; background:#0e0e10; border:1px solid var(--line); border-radius:999px; padding:4px; }
  .seg .seg-pill { position:absolute; left:0; top:4px; bottom:4px; width:0; background:var(--yellow); border-radius:999px; z-index:0; transition:transform .34s cubic-bezier(.4,0,.2,1), width .34s cubic-bezier(.4,0,.2,1), opacity .2s; }
  .seg button { position:relative; z-index:1; background:transparent; border:0; color:var(--muted); padding:9px 20px; border-radius:999px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; transition:color .25s; font-family:var(--mono); }
  .seg button.active { color:#000; }
  .seg.seg-sm button { padding:7px 14px; font-size:11px; }
  .period-wrap { display:flex; align-items:center; gap:8px; }
  .cal-box { position:relative; }
  .cal-btn { display:flex; align-items:center; justify-content:center; width:34px; height:34px; background:#0e0e10; border:1px solid var(--line); border-radius:8px; color:var(--muted); transition:color .2s,border-color .2s,background .2s; }
  .cal-btn:hover { color:var(--fg); border-color:#555; }
  .cal-btn.active { color:#000; background:var(--yellow); border-color:var(--yellow); }
  .cal-pop { position:absolute; right:0; top:42px; z-index:40; background:var(--panel); border:1px solid var(--line); padding:14px; display:flex; flex-direction:column; gap:10px; width:210px; box-shadow:0 14px 34px rgba(0,0,0,.6); }
  .cal-pop label { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin:0; }
  .cal-pop input { margin:0; padding:7px 9px; color-scheme:dark; flex:1; }
  .cal-pop .btn { width:100%; margin-top:2px; }
  .panel { border:1px solid var(--line); background:var(--panel); padding:16px 16px 8px; margin-top:14px; }
  .ph-panel { border:1px solid var(--line); background:var(--panel); padding:28px 24px; }
  .ph-panel h3 { margin:14px 0 8px; font-size:16px; color:#fff; letter-spacing:.02em; }
  .ph-panel p { color:#bdbdbe; max-width:640px; line-height:1.6; margin:0 0 10px; }
  .ph-badge { display:inline-block; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--yellow); border:1px solid #4a4426; border-radius:999px; padding:4px 12px; }
  .funnel { margin:22px 0 6px; max-width:560px; }
  .funnel .fn { display:grid; grid-template-columns:150px 1fr 34px; align-items:center; gap:12px; margin:9px 0; font-size:12px; color:#bdbdbe; }
  .funnel .fn i { display:block; height:22px; background:linear-gradient(90deg,#ebcc00,#9c8f22); opacity:.45; border-radius:2px; }
  .funnel .fn b { color:var(--muted); font-weight:400; text-align:right; }
  @media(max-width:600px){ .stats-head { flex-direction:column; align-items:stretch; } .period-wrap { justify-content:space-between; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script type="module">
import PocketBase from "https://esm.sh/pocketbase@0.26.2";
const PB_URL = "https://009-merch-backend-production.up.railway.app";
const pb = new PocketBase(PB_URL);
pb.autoCancellation(false);

const CATEGORIES = ["hoodies","t-shirts","shorts","shirts","accessories","denim"];
const SIZES = ["M/L","L/XL"];
const STATUSES = ["pending","paid","processing","shipped","done","cancelled"];
const LOGO = "../assets/store/brand-header.png";

const $ = (s,r=document)=>r.querySelector(s);
const app = $("#app");
const esc = (s)=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fileUrl = (rec,name)=>name?`${PB_URL}/api/files/${rec.collectionId}/${rec.id}/${name}`:"";
// Cloudinary: product photos live on the client's Cloudinary, one folder per product.
const CLD_CLOUD="gibcvoti", CLD_PRESET="009_products";
const slugify=s=>((s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"product");
const folderFor=p=>p.cloud_folder||`009/products/${slugify(p.name)}-${(p.id||"").slice(0,6)}`;
const imgSrc=im=>im.url||fileUrl(im,im.image);
async function cldUpload(file, folder){
  const fd=new FormData(); fd.append("file",file); fd.append("upload_preset",CLD_PRESET); fd.append("asset_folder",folder);
  const r=await fetch(`https://api.cloudinary.com/v1_1/${CLD_CLOUD}/image/upload`,{method:"POST",body:fd}).then(r=>r.json());
  if(!r.secure_url) throw new Error(r.error?.message||"Cloudinary upload failed");
  return {url:r.secure_url, public_id:r.public_id};
}
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }
// Ошибку показываем словами, а не тишиной: раньше кнопка «Change photo»
// просто ничего не делала, и понять причину было невозможно.
function fail(what, err){
  const detail = err?.data?.data ? Object.entries(err.data.data).map(([k,v])=>`${k}: ${v.message||v}`).join("; ") : "";
  const msg = detail || err?.message || String(err||"");
  console.error(what, err);
  alert(what + "\n" + msg);
}
async function safe(what, fn){ try { return await fn(); } catch(err){ fail(what, err); } }

/* Телефоны отдают снимки по 8-15 МБ, а айфон ещё и в HEIC. Ужимаем в браузере
   до разумного размера: и на сервер проходит, и сайт грузится быстрее.
   Если формат браузеру незнаком (HEIC в Chrome), отдаём файл как есть —
   сервер такие теперь принимает. */
async function shrinkImage(file, maxSide = 2400, quality = 0.86){
  if (!/^image\//.test(file.type || "")) return file;
  if (file.size < 900 * 1024) return file;
  try {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
    const w = Math.round(bitmap.width * scale), h = Math.round(bitmap.height * scale);
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);
    const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", quality));
    if (!blob || blob.size >= file.size) return file;
    const name = (file.name || "photo").replace(/\.[^.]+$/, "") + ".jpg";
    return new File([blob], name, { type: "image/jpeg" });
  } catch (err) {
    console.warn("сжать не вышло, отправляем оригинал", err);
    return file;
  }
}
let TAB="store";

/* ---------- login ---------- */
function renderLogin(msg=""){
  app.innerHTML = `<div class="login"><form id="lf">
    <img class="logo" src="${LOGO}" alt="009">
    <h1>Studio</h1><p>Manage the store visually</p>
    <label>Email<input id="email" type="email" required></label>
    <label>Password<input id="pass" type="password" required></label>
    <div class="err">${esc(msg)}</div>
    <button class="btn" style="width:100%;margin-top:16px" type="submit">Sign in</button>
  </form></div>`;
  $("#lf").addEventListener("submit", async e=>{ e.preventDefault();
    try { await pb.collection("_superusers").authWithPassword($("#email").value.trim(),$("#pass").value); renderApp(); }
    catch { renderLogin("Wrong email or password"); }
  });
}

/* ---------- shell ---------- */
function renderApp(){
  app.innerHTML = `<header class="bar">
    <img class="logo" src="${LOGO}" alt="009"><b class="yellow" style="letter-spacing:.1em;font-size:12px">STUDIO</b>
    <div class="tabs">
      <button data-t="store" class="${TAB==="store"?"active":""}">Home</button>
      <button data-t="catalog" class="${TAB==="catalog"?"active":""}">Catalog</button>
      <button data-t="orders" class="${TAB==="orders"?"active":""}">Orders</button>
      <button data-t="stats" class="${TAB==="stats"?"active":""}">Stats</button>

function wireImageUpload(btn, settingsId, field, after){
  btn.addEventListener("click",(e)=>{ e.stopPropagation();

    f.onchange=async()=>{
      const picked=f.files[0]; if(!picked) return;

        const file=await shrinkImage(picked);

/* native drag-reorder over children matching sel */
function enableDrag(container,onDrop,sel){
  let drag=null;
  container.querySelectorAll(sel).forEach(el=>{
    el.addEventListener("dragstart",(e)=>{ drag=el; el.classList.add("dragging"); e.stopPropagation(); });
    el.addEventListener("dragend",()=>{ el.classList.remove("dragging"); container.querySelectorAll(sel).forEach(x=>x.classList.remove("over")); });
    el.addEventListener("dragover",(e)=>{ e.preventDefault(); if(el!==drag) el.classList.add("over"); });
    el.addEventListener("dragleave",()=>el.classList.remove("over"));
    el.addEventListener("drop",(e)=>{ e.preventDefault(); el.classList.remove("over"); if(!drag||drag===el)return;
      const items=[...container.querySelectorAll(sel)]; const from=items.indexOf(drag),to=items.indexOf(el);
      if(from<to) el.after(drag); else el.before(drag);
      onDrop([...container.querySelectorAll(sel)].map(x=>x.dataset.id));
    });
  });
}

/* Синхронизация остатков: оплаченные (и дальше) заказы списывают остаток по размерам
   один раз (флаг stock_applied); отменённые после списания — возвращают. Идемпотентно. */
let _syncing=false;
async function syncStock(orders){
  if(_syncing) return; _syncing=true;
  try{
    if(!orders) orders=await pb.collection("orders").getFullList({sort:"-created"});
    const paidStates=["paid","processing","shipped","done"];
    const toApply=orders.filter(o=>paidStates.includes(o.status)&&!o.stock_applied&&Array.isArray(o.items));
    const toRestore=orders.filter(o=>o.status==="cancelled"&&o.stock_applied&&Array.isArray(o.items));
    if(!toApply.length&&!toRestore.length) return;
    const cache={};
    const getP=async id=>{ if(!(id in cache)){ try{cache[id]=await pb.collection("products").getOne(id);}catch{cache[id]=null;} } return cache[id]; };
    const dirty=new Set();
    const bump=async(items,sign)=>{ for(const it of items){ if(!it||!it.product||!it.size) continue; const p=await getP(it.product); if(!p) continue;
      const st=(p.stock&&typeof p.stock==="object"&&!Array.isArray(p.stock))?{...p.stock}:{};
      if(!(it.size in st)) continue; // размер без учёта — пропускаем
      st[it.size]=Math.max(0,(Number(st[it.size])||0)+sign*(Number(it.qty)||1)); p.stock=st; dirty.add(it.product); } };
    for(const o of toApply) await bump(o.items,-1);
    for(const o of toRestore) await bump(o.items,1);
    for(const id of dirty) if(cache[id]) await pb.collection("products").update(id,{stock:cache[id].stock});
    for(const o of toApply) await pb.collection("orders").update(o.id,{stock_applied:true});
    for(const o of toRestore) await pb.collection("orders").update(o.id,{stock_applied:false});
  }catch(e){ console.warn("syncStock",e); } finally{ _syncing=false; }
}

  const s=new Date(now.getTime()-29*DAY); s.setHours(0,0,0,0); return {start:s,end:now,gran:"day",label:"30 дней"};
}
function buildBuckets(paid,start,end,gran){
  const cats=[]; const map={};
  if(gran==="hour"){
    for(let h=0;h<24;h++){ cats.push(h+":00"); map[h]=0; }
    paid.forEach(o=>{ const d=new Date(o.created); if(d>=start&&d<=end) map[d.getHours()]=(map[d.getHours()]||0)+(Number(o.total)||0); });
    return {cats, vals:cats.map((_,h)=>Math.round((map[h]||0)*100)/100)};
  }
  const s=new Date(start); s.setHours(0,0,0,0); const e=new Date(end); e.setHours(0,0,0,0); const keys=[];
  for(let t=s.getTime(); t<=e.getTime(); t+=DAY){ const d=new Date(t); const k=ymd(d); keys.push(k); cats.push(fmtD(d)); map[k]=0; }
  paid.forEach(o=>{ const k=ymd(new Date(o.created)); if(k in map) map[k]+=Number(o.total)||0; });
  return {cats, vals:keys.map(k=>Math.round(map[k]*100)/100)};
}

async function renderStats(){
  $("#view").innerHTML=`<div class="canvas">
    <div class="stats-head">
      <div class="seg" id="view-seg">
        <span class="seg-pill"></span>
        <button data-v="orders" class="${STATS_VIEW==="orders"?"active":""}">Заказы</button>
        <button data-v="actions" class="${STATS_VIEW==="actions"?"active":""}">Действия на сайте</button>
      </div>
      <div class="period-wrap" id="period-wrap">
        <div class="seg seg-sm" id="per-seg">
          <span class="seg-pill"></span>
          <button data-p="today" class="${STATS_PERIOD==="today"?"active":""}">1 день</button>
          <button data-p="7d" class="${STATS_PERIOD==="7d"?"active":""}">Неделя</button>
          <button data-p="30d" class="${STATS_PERIOD==="30d"?"active":""}">30 дней</button>
        </div>
        <div class="cal-box">
          <button class="cal-btn ${STATS_PERIOD==="custom"?"active":""}" id="cal-btn" title="Свой период">${CAL_SVG}</button>
          <div class="cal-pop hidden" id="cal-pop">
            <label>С<input type="date" id="cal-from"></label>
            <label>По<input type="date" id="cal-to"></label>
            <button class="btn btn--sm" id="cal-apply">Применить</button>
          </div>
        </div>
      </div>
    </div>
    <div id="stats-body"></div>
  </div>`;
  const vseg=$("#view-seg"), pseg=$("#per-seg");
  requestAnimationFrame(()=>{ _pill(vseg); _pill(pseg); });
  vseg.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
    if(STATS_VIEW===b.dataset.v) return;
    STATS_VIEW=b.dataset.v;
    vseg.querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));
    _pill(vseg);
    $("#period-wrap").style.visibility = "visible";
    _destroyCharts();
    STATS_VIEW==="orders"?drawOrdersStats():drawActionsStats();
  }));
  pseg.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
    STATS_PERIOD=b.dataset.p; STATS_RANGE=null;
    pseg.querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));
    $("#cal-btn").classList.remove("active"); $("#cal-pop").classList.add("hidden");
    _pill(pseg); STATS_VIEW==="orders"?applyPeriod():drawActionsStats();
  }));
  $("#cal-btn").addEventListener("click",e=>{ e.stopPropagation(); $("#cal-pop").classList.toggle("hidden"); });
  $("#cal-pop").addEventListener("click",e=>e.stopPropagation());
  document.addEventListener("click",()=>{ const p=$("#cal-pop"); if(p) p.classList.add("hidden"); });
  $("#cal-apply").addEventListener("click",()=>{
    const f=$("#cal-from").value, t=$("#cal-to").value;
    if(!f||!t){ toast("Выберите обе даты"); return; }
    if(f>t){ toast("Дата «С» позже «По»"); return; }
    STATS_PERIOD="custom"; STATS_RANGE={from:f,to:t};
    pseg.querySelectorAll("button").forEach(x=>x.classList.remove("active")); _pill(pseg);
    $("#cal-btn").classList.add("active"); $("#cal-pop").classList.add("hidden");
    STATS_VIEW==="orders"?applyPeriod():drawActionsStats();
  });
  $("#period-wrap").style.visibility = STATS_VIEW==="orders"?"visible":"hidden";
  STATS_VIEW==="orders"?drawOrdersStats():drawActionsStats();
}

async function drawOrdersStats(){
  const body=$("#stats-body");
  body.innerHTML=`
   <div class="kpis" id="kpis"></div>
   <div class="panel"><div class="sec-title" style="margin-top:0" id="rev-title">Выручка</div><div id="rev-chart"></div></div>
   <div class="two" style="margin-top:16px">
     <div class="panel"><div class="sec-title" style="margin-top:0">Топ товаров</div><div id="prod-wrap"></div></div>
     <div class="panel"><div class="sec-title" style="margin-top:0">Топ размеров</div><div id="size-chart"></div><p class="muted hidden" id="size-empty">Нет продаж за период.</p></div>
   </div>`;
  if(!_allOrders) _allOrders=await pb.collection("orders").getFullList({sort:"-created"});
  _destroyCharts();
  const ApexCharts=await getApex();
  if(ApexCharts && STATS_VIEW==="orders"){
    _revChart=new ApexCharts(document.querySelector("#rev-chart"),{
      chart:{type:"bar",height:300,background:"transparent",fontFamily:"inherit",toolbar:{show:false},animations:{enabled:true,easing:"easeinout",speed:750,dynamicAnimation:{enabled:true,speed:600}}},
      theme:{mode:"dark"},
      series:[{name:"Выручка",data:[]}],
      xaxis:{categories:[],tickAmount:8,labels:{rotate:0,hideOverlappingLabels:true,style:{colors:"#7a7a7a",fontSize:"10px"}},axisBorder:{color:"#222"},axisTicks:{color:"#222"}},
      yaxis:{labels:{style:{colors:"#7a7a7a"},formatter:v=>"€"+Math.round(v)}},
      colors:["#ebcc00"],
      plotOptions:{bar:{columnWidth:"58%",borderRadius:3}},
      fill:{type:"gradient",gradient:{shade:"dark",type:"vertical",gradientToColors:["#8a7d1a"],shadeIntensity:.35,opacityFrom:.95,opacityTo:.8,stops:[0,100]}},
      grid:{borderColor:"#1c1c1c",strokeDashArray:3},
      dataLabels:{enabled:false},
      tooltip:{theme:"dark",y:{formatter:v=>money(v)}}
    });
    _revChart.render();
    _sizeChart=new ApexCharts(document.querySelector("#size-chart"),{
      chart:{type:"donut",height:280,background:"transparent",fontFamily:"inherit",animations:{enabled:true,speed:700,dynamicAnimation:{enabled:true,speed:500}}},
      theme:{mode:"dark"}, series:[], labels:[],
      colors:["#ebcc00","#9c8f22","#5f571f","#3a3620","#262418"],
      legend:{position:"bottom",labels:{colors:"#bdbdbe"}},
      dataLabels:{enabled:true,formatter:v=>Math.round(v)+"%",style:{colors:["#000"]}},
      stroke:{colors:["#0e0e10"],width:2},
      tooltip:{theme:"dark",y:{formatter:v=>v+" шт."}},
      plotOptions:{pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"Единиц",color:"#7a7a7a",formatter:()=>String(_lastUnits)}}}}}
    });
    _sizeChart.render();
  }
  applyPeriod();
}

let _lastUnits=0;
function applyPeriod(){
  if(STATS_VIEW!=="orders") return;
  const orders=_allOrders||[];
  const {start,end,gran,label}=periodInfo();
  const inWin=o=>{ const t=new Date(o.created).getTime(); return t>=start.getTime() && t<=end.getTime(); };
  const paid=orders.filter(o=>PAID_STATES.includes(o.status) && inWin(o));
  const rev=paid.reduce((s,o)=>s+(Number(o.total)||0),0);
  let units=0; paid.forEach(o=>(Array.isArray(o.items)?o.items:[]).forEach(i=>units+=Number(i.qty)||0)); _lastUnits=units;
  const aov=paid.length?rev/paid.length:0;
  const pend=orders.filter(o=>o.status==="pending"&&inWin(o)).length;
  const canc=orders.filter(o=>o.status==="cancelled"&&inWin(o)).length;
  const kp=$("#kpis"); if(kp) kp.innerHTML=`
     <div class="kpi"><div class="k-label">Выручка · ${label}</div><div class="k-val">${money(rev)}</div><div class="k-sub">${paid.length} оплаченных</div></div>
     <div class="kpi"><div class="k-label">Оплаченных заказов</div><div class="k-val">${paid.length}</div><div class="k-sub">ожидают: <b>${pend}</b> · отменено: <b>${canc}</b></div></div>
     <div class="kpi"><div class="k-label">Средний чек</div><div class="k-val">${money(aov)}</div><div class="k-sub">за период</div></div>
     <div class="kpi"><div class="k-label">Продано единиц</div><div class="k-val">${units}</div><div class="k-sub">за период</div></div>`;
  const rt=$("#rev-title"); if(rt) rt.textContent="Выручка · "+label;
  const {cats,vals}=buildBuckets(paid,start,end,gran);
  if(_revChart){ try{ _revChart.updateOptions({ series:[{name:"Выручка",data:vals}], xaxis:{categories:cats} }, false, true); }catch(e){} }
  const prod={},size={};
  paid.forEach(o=>(Array.isArray(o.items)?o.items:[]).forEach(i=>{ const q=Number(i.qty)||0,r=(Number(i.price)||0)*q,nm=i.name||"—",sz=i.size||"—"; prod[nm]=prod[nm]||{u:0,r:0};prod[nm].u+=q;prod[nm].r+=r;size[sz]=(size[sz]||0)+q; }));
  const topProd=Object.entries(prod).sort((a,b)=>b[1].u-a[1].u).slice(0,8);
  const topSize=Object.entries(size).sort((a,b)=>b[1]-a[1]);
  const pw=$("#prod-wrap"); if(pw) pw.innerHTML= topProd.length?`<table class="otable"><thead><tr><th>Товар</th><th style="text-align:right">Шт.</th><th style="text-align:right">Выручка</th></tr></thead><tbody>${topProd.map(([n,v])=>`<tr><td>${esc(n)}</td><td style="text-align:right">${v.u}</td><td style="text-align:right" class="muted">${money(v.r)}</td></tr>`).join("")}</tbody></table>`:'<p class="muted" style="margin:6px 0">Нет продаж за период.</p>';
  const se=$("#size-empty"), sc=document.querySelector("#size-chart");
  if(_sizeChart){ try{ _sizeChart.updateOptions({ series:topSize.map(s=>s[1]), labels:topSize.map(s=>s[0]) }, false, true); }catch(e){} }
  if(sc) sc.classList.toggle("hidden",!topSize.length);
  if(se) se.classList.toggle("hidden",!!topSize.length);
}

const fmtDur=s=>{ s=Math.round(Number(s)||0); return s>=60 ? Math.floor(s/60)+"м "+(s%60)+"с" : s+"с"; };
async function drawActionsStats(){
  const body=$("#stats-body");
  body.innerHTML='<p class="muted" style="padding:16px 0">Загрузка аналитики…</p>';
  const {start,end,label}=periodInfo();
  let d=null;
  try{ d=await pb.send("/api/shop/analytics",{method:"GET",query:{from:ymd(start),to:ymd(end)}}); }catch(e){ d=null; }
  if(STATS_VIEW!=="actions") return;
  if(!d || d.configured===false){
    body.innerHTML=`<div class="ph-panel"><span class="ph-badge">PostHog · EU</span>
      <h3>Аналитика подключается…</h3>
      <p>Как только на сайт пойдёт трафик — здесь появятся посещения, страны, время на сайте, источники, устройства и воронка. Если сообщение висит долго — проверю ключ.</p></div>`;
    return;
  }
  const k=d.kpis||{};
  const barList=(arr,unit)=>{
    if(!arr||!arr.length) return '<p class="muted" style="margin:6px 0">Нет данных за период.</p>';
    const max=Math.max(1,...arr.map(x=>x.count));
    return arr.map(x=>`<div class="bar-row"><span class="lab">${esc(x.name)}</span><span class="track"><i style="width:${Math.round(x.count/max*100)}%"></i></span><span class="num">${x.count}${unit||""}</span></div>`).join("");
  };
  const fn=d.funnel||[]; const fmax=Math.max(1,...fn.map(x=>x.n));
  const empty=(k.pageviews||0)===0;
  body.innerHTML=`
   <div class="kpis">
     <div class="kpi"><div class="k-label">Посещения · ${label}</div><div class="k-val">${k.pageviews||0}</div><div class="k-sub">просмотры страниц</div></div>
     <div class="kpi"><div class="k-label">Уникальные</div><div class="k-val">${k.uniques||0}</div><div class="k-sub">посетители</div></div>
     <div class="kpi"><div class="k-label">Ср. время на сайте</div><div class="k-val">${fmtDur(k.avg_seconds)}</div><div class="k-sub">за сессию</div></div>
     <div class="kpi"><div class="k-label">Конверсия</div><div class="k-val">${k.conversion||0}%</div><div class="k-sub">визит → оплата</div></div>
   </div>
   <div class="panel"><div class="sec-title" style="margin-top:0">Воронка покупки</div>
     <div class="funnel">${fn.map(s=>`<div class="fn"><span>${esc(s.step)}</span><i style="width:${Math.round(s.n/fmax*100)}%"></i><b>${s.n}</b></div>`).join("")}</div>
   </div>
   <div class="two" style="margin-top:16px">
     <div class="panel"><div class="sec-title" style="margin-top:0">Страны</div>${barList(d.countries)}</div>
     <div class="panel"><div class="sec-title" style="margin-top:0">Источники</div>${barList(d.sources)}</div>
   </div>
   <div class="panel"><div class="sec-title" style="margin-top:0">Устройства</div>${barList(d.devices)}</div>
   ${empty?'<p class="muted" style="margin-top:16px">Пока пусто — данные появятся, как только на сайт зайдут посетители (боты не считаются). Всё подключено и собирается автоматически.</p>':''}`;
}

/* ---------- notify recipients (кто видит новые заказы в боте) ---------- */
async function renderRecipients(){
  $("#view").innerHTML=`<div class="canvas">
    <div class="sec-title">Получатели заказов <span class="hint">· кому в бот падают новые заказы</span></div>
    <div style="display:flex;gap:8px;max-width:440px;margin-top:6px">
      <input id="rec-code" placeholder="Код из /start (напр. 4KDP7Q)" maxlength="12" autocomplete="off"
        style="flex:1;background:#111;border:1px solid #333;color:#fff;padding:11px 13px;font-family:var(--mono,monospace);letter-spacing:.12em;text-transform:uppercase">
      <button class="btn" id="rec-add-btn">Добавить</button>
    </div>
    <p class="muted" style="margin:12px 0 20px;font-size:12px;max-width:560px;line-height:1.5">
      Человек пишет боту <b>/start</b> → бот выдаёт ему код → вставьте код сюда и нажмите «Добавить». После этого ему начнут приходить новые заказы. Управлять статусами он сможет прямо в боте.</p>
    <div id="rw">Loading…</div></div>`;

  const draw=async()=>{
    const recs=await pb.collection("notify_recipients").getFullList({sort:"-created"});
    $("#rw").innerHTML = recs.length ? recs.map(r=>`
      <div class="rec-row" style="display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #222">
        <span class="badge ${r.active?"on":""}">${r.active?"активен":"ожидает"}</span>
        <b>${esc(r.name||"—")}</b>
        <span class="muted" style="font-size:12px">id ${esc(r.chat_id)} · код ${esc(r.code)}</span>
        <span class="spacer" style="flex:1"></span>
        ${r.active
          ? `<button class="btn btn--ghost btn--sm" data-off="${r.id}">Отключить</button>`
          : `<button class="btn btn--sm" data-on="${r.id}">Включить</button>`}
        <button class="btn btn--ghost btn--sm" data-del="${r.id}" title="Удалить">✕</button>
      </div>`).join("")
      : '<p class="muted" style="margin-top:14px">Пока нет получателей. Пусть человек напишет боту /start и передаст код.</p>';
    $("#rw").querySelectorAll("[data-on]").forEach(b=>b.addEventListener("click",()=>safe("Не удалось включить", async()=>{await pb.collection("notify_recipients").update(b.dataset.on,{active:true});toast("Включён");draw();})));
    $("#rw").querySelectorAll("[data-off]").forEach(b=>b.addEventListener("click",()=>safe("Не удалось отключить", async()=>{await pb.collection("notify_recipients").update(b.dataset.off,{active:false});toast("Отключён");draw();})));
    $("#rw").querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",async()=>{await pb.collection("notify_recipients").delete(b.dataset.del);toast("Удалён");draw();}));
  };
  await draw();

  $("#rec-add-btn").addEventListener("click",async()=>{
    const code=$("#rec-code").value.trim().toUpperCase();
    if(!code) return;
    const found=await pb.collection("notify_recipients").getList(1,1,{filter:`code="${code}"`});
    if(!found.items.length){ toast("Код не найден — человек должен сначала написать боту /start"); return; }
    await pb.collection("notify_recipients").update(found.items[0].id,{active:true});
    $("#rec-code").value=""; toast("Получатель добавлен"); draw();
  });
}

if(pb.authStore.isValid && pb.authStore.record) renderApp(); else renderLogin();
